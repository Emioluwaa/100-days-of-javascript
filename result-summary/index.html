<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <title>Frontend Mentor | Results summary component</title>
</head>
<body>

    <main class="card">
        <section class="result">
            <h1>Your Result</h1>
            <div class="score-circle">
                <p class="points">76</p>
                <p class="out-of">of 100</p>
            </div>
            <p class="grade">Great</p>
            <p class="description">You scored higher than 65% of the people who have taken these tests.</p>
        </section>

        <section class="summary">
            <h2>Summary</h2>
            <ul class="categories">
                <li class="category reaction">
                    <span class="name">
                        <img src="assets/images/icon-reaction.svg" alt="" class="icon">
                        Reaction
                    </span>
                    <p class="score"><strong>80</strong> / 100</p>
                </li>
                <li class="category memory">
                    <span class="name">
                        <img src="assets/images/icon-memory.svg" alt="" class="icon">
                        Memory
                    </span>
                    <p class="score"><strong>92</strong> / 100</p>
                </li>
                <li class="category verbal">
                    <span class="name">
                        <img src="assets/images/icon-verbal.svg" alt="" class="icon">
                        Verbal
                    </span>
                    <p class="score"><strong>61</strong> / 100</p>
                </li>
                <li class="category visual">
                    <span class="name">
                        <img src="assets/images/icon-visual.svg" alt="" class="icon">
                        Visual
                    </span>
                    <p class="score"><strong>72</strong> / 100</p>
                </li>
            </ul>
            <button type="button" class="btn">Continue</button>
        </section>
    </main>
</body>
</html>
